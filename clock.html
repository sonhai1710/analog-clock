<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analog Clock Random (5-minute steps)</title>
  <style>
    :root {
      --clock-size: min(360px, 80vw);
      --bg: #0b1220;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.65);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 700px at 20% 20%, #18274b 0%, var(--bg) 45%, #050812 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .app {
      width: min(720px, 92vw);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.2px;
      color: var(--text);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }
    button:hover {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.26);
    }
    button:active { transform: translateY(1px); }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.4;
    }

    /* Clock */
    .clock-wrap {
      display: none; /* hidden until Start */
      gap: 14px;
      justify-items: center;
    }

    .clock {
      width: var(--clock-size);
      height: var(--clock-size);
      border-radius: 50%;
      position: relative;
      border: 2px solid rgba(255,255,255,0.18);
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.12), transparent 45%),
        radial-gradient(circle at 70% 75%, rgba(255,255,255,0.08), transparent 50%),
        rgba(0,0,0,0.18);
      box-shadow:
        inset 0 0 0 8px rgba(255,255,255,0.03),
        0 25px 70px rgba(0,0,0,0.55);
      overflow: hidden;
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 0 0;
      background: rgba(255,255,255,0.35);
      border-radius: 2px;
    }

    .tick.major {
      background: rgba(255,255,255,0.65);
    }

    .numbers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      font-weight: 650;
      color: rgba(255,255,255,0.75);
    }

    .num {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
    }

    .hand {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg);
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .hand.hour {
      width: 10px;
      height: calc(var(--clock-size) * 0.28);
      background: rgba(255,255,255,0.88);
    }

    .hand.minute {
      width: 6px;
      height: calc(var(--clock-size) * 0.38);
      background: rgba(255,255,255,0.78);
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .time-label {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }
	
	.time-label { display: none; }
  </style>
</head>

<body>
  <div class="app">
    <h1>Analog Clock (Random theo bước 5 phút)</h1>

    <div class="controls" id="startControls">
      <button id="btnStart">Start</button>
    </div>

    <div class="clock-wrap" id="clockWrap">
      <div class="clock" id="clock">
        <!-- ticks + numbers generated by JS -->
        <div class="hand hour" id="hourHand"></div>
        <div class="hand minute" id="minuteHand"></div>
        <div class="center-dot"></div>
      </div>

      <div class="controls">
        <button id="btnRandom">Random</button>
      </div>

      <!-- (Tuỳ chọn) nhãn giờ phút để bạn dễ kiểm tra. Không có AM/PM -->
      <div class="time-label" id="timeLabel"></div>
    </div>

    <p class="hint">
      Bấm Start để hiện đồng hồ. Sau đó bấm Random để tạo giờ ngẫu nhiên (00, 05, 10, ..., 55).
    </p>
  </div>

  <script>
    const btnStart = document.getElementById('btnStart');
    const startControls = document.getElementById('startControls');
    const clockWrap = document.getElementById('clockWrap');
    const clockEl = document.getElementById('clock');

    const btnRandom = document.getElementById('btnRandom');
    const hourHand = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const timeLabel = document.getElementById('timeLabel');

    function pad2(n) { return String(n).padStart(2, '0'); }

    function buildTicksAndNumbers() {
      // Ticks: 60 vạch; vạch lớn mỗi 5 phút
      for (let i = 0; i < 60; i++) {
        const tick = document.createElement('div');
        tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');

        const isMajor = i % 5 === 0;
        const length = isMajor ? 14 : 8;
        const thickness = isMajor ? 3 : 2;

        tick.style.width = length + 'px';
        tick.style.height = thickness + 'px';

        // đặt tick từ tâm ra ngoài, rồi xoay
        // translate: đưa đến vị trí gần viền; (size/2 - padding)
        const radius = (clockEl.clientWidth / 2) - 18;
        tick.style.transform = `rotate(${i * 6}deg) translate(${radius}px, -${thickness / 2}px)`;

        clockEl.appendChild(tick);
      }

      // Numbers 1..12 see quanh mặt đồng hồ
      const numbers = document.createElement('div');
      numbers.className = 'numbers';

      const r = (clockEl.clientWidth / 2) - 44;
      for (let n = 1; n <= 12; n++) {
        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = n;

        const angle = (n * 30 - 90) * Math.PI / 180; // -90 để 12 ở trên
        const x = (clockEl.clientWidth / 2) + r * Math.cos(angle);
        const y = (clockEl.clientHeight / 2) + r * Math.sin(angle);

        num.style.left = x + 'px';
        num.style.top = y + 'px';

        numbers.appendChild(num);
      }

      clockEl.appendChild(numbers);
    }

    function setClockTime(hour12, minute) {
      // hour12: 1..12, minute: 0..59
      const h = hour12 % 12;

      const minuteAngle = minute * 6;            // 360/60
      const hourAngle = h * 30 + minute * 0.5;   // 360/12 + tiến theo phút

      minuteHand.style.transform = `translate(-50%, -100%) rotate(${minuteAngle}deg)`;
      hourHand.style.transform = `translate(-50%, -100%) rotate(${hourAngle}deg)`;

      timeLabel.textContent = `${hour12}:${pad2(minute)}`;
    }

    function randomTime5MinStep() {
      const minute = Math.floor(Math.random() * 12) * 5; // 0,5,...,55
      const hour = Math.floor(Math.random() * 12) + 1;   // 1..12
      return { hour, minute };
    }

    btnStart.addEventListener('click', () => {
      startControls.style.display = 'none';
      clockWrap.style.display = 'grid';

      // build once
      buildTicksAndNumbers();

      // init a random time (hoặc có thể default 6:00)
      const t = randomTime5MinStep();
      setClockTime(t.hour, t.minute);
    });

    btnRandom.addEventListener('click', () => {
      const t = randomTime5MinStep();
      setClockTime(t.hour, t.minute);
    });
  </script>
</body>
</html>
